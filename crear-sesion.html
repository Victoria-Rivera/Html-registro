<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lart_duniss - Registro de Usuario</title>
    <!-- Bootstrap CSS -->
    <link href="/assets/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        .product-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
        }
        body {
            background: #f3f3f3;
        }
        .mensaje_error {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
            display: block;
        }
        .mensaje_exito {
            color: #198754;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="Imagenes/Banner.jpg" alt="Logo" width="40" height="40" class="d-inline-block align-text-top">
                <strong>Lart_duniss</strong>
            </a>
            <div class="collapse navbar-collapse justify-content-center" id="navbarTopContent">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="Catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link active" href="crear-sesion.html">Registro</a></li>
                </ul>
            </div>
            <div class="d-flex">
                <a href="iniciar-sesion.html" class="btn btn-outline-primary ms-2">Iniciar Sesión</a>
                <a href="crear-sesion.html" class="btn btn-primary ms-2">Crear Cuenta</a>
            </div>
        </div>
    </nav>
    
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card text-start shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="card-title mb-3">Registro de nuevo usuario</h4>
                        <p class="card-text text-muted">Bienvenidos a Lart_duniss. Ingrese sus datos personales.</p>
                        
                        <form id="form_chileno">
                            <div class="row">
                                <!-- RUN con ID único y su span de error -->
                                <div class="col-6 mb-3">
                                    <label for="campo_run" class="form-label">RUN<small class="text-danger">*</small></label>
                                    <input type="text" class="form-control" id="campo_run" placeholder="ej: 12.345.678-9" name="campo_run" required>
                                    <span class="mensaje_error" id="mensaje_run"></span>
                                </div>
                                <div class="mb-3 col-6 col-md-6">
                                    <label for="fechaNacimiento" class="form-label">Fecha nacimiento<small class="text-danger">*</small></label>
                                    <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
                                </div>
                                
                                <!-- Nombre con ID único y su span de error -->
                                <div class="col-6 mb-3">
                                    <label for="campo_nombre" class="form-label">Nombre<small class="text-danger">*</small></label>
                                    <input type="text" class="form-control" id="campo_nombre" name="campo_nombre" placeholder="Nombre Apellido" required>
                                    <span class="mensaje_error" id="mensaje_nombre"></span>
                                </div>
                                <div class="col-6 mb-3">
                                    <label for="apellidos" class="form-label">Apellidos<small class="text-danger">*</small></label>
                                    <input type="text" class="form-control" id="apellidos" name="apellidos" required>
                                </div>

                                <div class="mb-3 col-6">
                                    <label for="correo" class="form-label">Correo<small class="text-danger">*</small></label>
                                    <input type="email" class="form-control" id="correo" name="correo" required>
                                </div>

                                <div class="mb-3 col-6">
                                    <label for="password" class="form-label">Contraseña<small class="text-danger">*</small></label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                            </div>

                            <hr class="w-100 my-4">
                            <h4 class="card-title mb-2">Dirección de la entrega de los productos</h4>
                            <p class="card-text text-muted">Ingrese dirección de forma detallada</p>
                            
                            <div class="row">
                                <div class="mb-3 col-12 col-md-6">
                                    <label for="calle" class="form-label">Calle<small class="text-danger">*</small></label>
                                    <input type="text" class="form-control" id="calle" name="calle" required>
                                </div>
                                <div class="mb-3 col-12 col-md-6">
                                    <label for="depto" class="form-label">Departamento (opcional)</label>
                                    <input type="text" class="form-control" id="depto" name="depto" placeholder="Ej: 603">
                                </div>

                                <div class="mb-3 col-6 col-md-6">
                                    <label for="regionSelect" class="form-label">Región<small class="text-danger">*</small></label>
                                    <select class="form-select" id="regionSelect" required></select>
                                </div>
                                <div class="mb-3 col-6 col-md-6">
                                    <label for="comunaSelect" class="form-label">Comuna<small class="text-danger">*</small></label>
                                    <select class="form-select" id="comunaSelect" required></select>
                                </div>

                                <div class="mb-3">
                                    <label for="indicaciones" class="form-label">Indicaciones para la entrega (opcional)</label>
                                    <textarea class="form-control" id="indicaciones" rows="3" placeholder="Ej.: Entre calles, color del edificio..."></textarea>
                                </div>
                            </div>

                            <!-- Mensaje de éxito general -->
                            <p id="mensaje_exito" class="mensaje_exito my-2"></p>

                            <div class="text-end">
                                <button type="reset" class="btn btn-secondary me-2" onclick="limpiar_errores()">Limpiar</button>
                                <button type="button" class="btn btn-primary" onclick="procesarRegistro()">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/assets/jquery-3.6.0.min.js"></script>
    <script src="/assets/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="/assets/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/data/zonas.js"></script>

    <script>
        // CARGA DE REGIONES Y COMUNAS
        window.onload = function () {
            const regionSelect = document.getElementById('regionSelect');
            const comunaSelect = document.getElementById('comunaSelect');

            if (typeof regiones !== 'undefined') {
                regiones.forEach(region => {
                    const option = document.createElement('option');
                    option.value = region.id;
                    option.textContent = region.nombre;
                    regionSelect.appendChild(option);
                });

                regionSelect.addEventListener('change', function () {
                    const selectedRegionId = parseInt(this.value);
                    comunaSelect.innerHTML = '';
                    const filteredComunas = comunas.filter(comuna => comuna.id_region === selectedRegionId);
                    filteredComunas.forEach(comuna => {
                        const option = document.createElement('option');
                        option.value = comuna.id;
                        option.textContent = comuna.nombre;
                        comunaSelect.appendChild(option);
                    });
                });

                regionSelect.dispatchEvent(new Event('change'));
            }
        };

        // LÓGICA DE VALIDACIÓN CHILENA (RUN y NOMBRE)
        function limpiar_errores() {
            const lista_errores = document.getElementsByClassName("mensaje_error");
            for (const elemento of lista_errores) {
                elemento.innerHTML = "";
            }
            let mensajeExito = document.getElementById("mensaje_exito");
            if (mensajeExito) mensajeExito.innerHTML = "";
        }

        function validar_nombre(nombre_ingresado) {
            if (!nombre_ingresado) return false;
            nombre_ingresado = nombre_ingresado.trim();
            var valido = (nombre_ingresado.length > 2);
            valido = valido && isNaN(nombre_ingresado);
            return valido;
        }

        function validar_run(rutCompleto) {
            if (!rutCompleto) return false;
            rutCompleto = rutCompleto.replace(/^0+|[\s.]+/g, '');
            if (!/^[0-9]+[-|‐]{1}[0-9kK]{1}$/.test(rutCompleto)) return false;

            const tmp = rutCompleto.split('-');
            let digv = tmp[1];
            const rut = tmp[0];
            if (digv == 'K') digv = 'k';

            return calcular_dv(rut) == digv;
        }

        function calcular_dv(T) {
            let suma = 0;
            let multiplicador = 2;

            for (let i = 1; i <= T.length; i++) {
                suma += parseInt(T.charAt(T.length - i)) * multiplicador;
                multiplicador = multiplicador < 7 ? multiplicador + 1 : 2;
            }

            const resto = suma % 11;
            const dvCalculado = 11 - resto;

            if (dvCalculado == 11) return '0';
            if (dvCalculado == 10) return 'k';
            return dvCalculado.toString();
        }

        function procesarRegistro() {
            limpiar_errores();

            const formulario = document.getElementById("form_chileno");
            const datos_formulario = new FormData(formulario);
            var nombre = datos_formulario.get("campo_nombre");
            var run = datos_formulario.get("campo_run");

            let error = false;

            if (!validar_nombre(nombre)) {
                let caja_error = document.getElementById("mensaje_nombrfffe");
                caja_error.innerHTML = "El nombre ingresado no es válido (mínimo 3 caracteres y sin números).";
                error = true;
            }
            if (!validar_run(run)) {
                let caja_error = document.getElementById("mensaje_run");
                caja_error.innerHTML = "El RUN ingresado no es válido (ej: 12.345.678-9).";
                error = true;
            }

            if (!error) {
                let caja_exito = document.getElementById("mensaje_exito");
                caja_exito.innerHTML = "¡Los datos fueron ingresados y validados correctamente!";
                
                // Alerta visual con Toastify
                Toastify({
                    text: "¡Registro exitoso!",
                    duration: 3000,
                    close: true,
                    gravity: "top",
                    position: "right",
                    style: { background: "linear-gradient(to right, #00b09b, #96c93d)" }
                }).showToast();
            } else {
                Toastify({
                    text: "Hay errores en el formulario.",
                    duration: 3000,
                    close: true,
                    gravity: "top",
                    position: "right",
                    style: { background: "linear-gradient(to right, #ff5f6d, #ffc371)" }
                }).showToast();
            }
        }
    </script>
</body>

</html>
